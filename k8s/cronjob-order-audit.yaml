# PLANTILLA (SC-6595; SC-5806 C-2, Dani 25-11: sin redes por reloj). Desde SKIRM-628
# el camino va por evento — `shopify.skirmshop.orders.paid` (gateway →
# synapse-adapter-shopify) → workflow synapse `skirmshop.k8s.shopify-picqer-order-audit`
# → Job desde este CronJob con `SOLO_ORDER=<ORDnnnnn>` (mismo join, misma min-age
# esperada, mismas excepciones). Este CronJob ya no corre por horario: es solo la
# plantilla del Job. Lo que cubría el barrido diario de las 02:30 y ya no cubre nadie
# hasta el reloj único de la ola 2: eventos perdidos, pedidos que nunca disparan
# `orders/paid` (authorized / parcialmente pagados / capturas manuales), los pedidos
# de campaña cuyo fulfillment order pasa a OPEN cuando llega el stock
# (`fulfillment_orders/open` no está en el bus) y el gauge SC-389
# `shopify_picqer_order_audit_findings`, que solo empuja el barrido.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-picqer-order-audit
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: order-audit
spec:
  suspend: true
  schedule: "0 0 31 2 *" # nunca: plantilla del Job que crea synapse-adapter-k8s
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: order-audit
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
            topology: lan
          containers:
            - name: order-audit
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:58865b51562ebe45ac13c0cfe655f5f531a1a469539adc4599e8300fe21ac223
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - node
                - dist/scripts/audit-shopify-picqer-orders.js
              env:
                - name: ORDER_AUDIT_LOOKBACK_DAYS
                  value: "14"
                - name: ORDER_AUDIT_MIN_AGE_MINUTES
                  value: "15"
                - name: SHOPIFY_ORDER_AUDIT_API_VERSION
                  value: "2026-07"
                # Reconciled exceptions (SKIRM-168), revisadas en SKIRM-628 y
                # todavía aplicables (estado leído de Shopify el 24-11-2026):
                # ORD19177 sigue PARTIALLY_FULFILLED (fulfillment manual del
                # 07-10; su línea de servicio «Mantenimiento Replica» sigue sin
                # SKU y re-importarla arriesgaría un doble envío). ORD19272,
                # ORD19289 y ORD19407 siguen ON_HOLD — pedidos de campaña/
                # preorder sin stock (fabricación en curso): Picqer importa
                # cuando el fulfillment order pasa a OPEN, y ese evento no
                # existe en el bus, así que sin esta excepción cada barrido
                # (y, desde SKIRM-628, cada evento paid repetido) sería ruido.
                # SKIRM-521 intentó caducarlas por plazo y se revirtió (#22).
                - name: ORDER_AUDIT_EXCEPTIONS
                  value: "ORD19177,ORD19272,ORD19289,ORD19407"
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              # I/O-bound API sync: it spends its time waiting on Picqer and
              # Shopify, so 25m is a sufficient floor. There is no CPU limit
              # here, so this lowers the guaranteed floor only, never the burst.
              # `ubuntu` is the only amd64 + topology=lan node and ~9 of its 16
              # CPU are legitimately reserved by bursty inference services, so
              # even a small floor is enough to leave a run Pending. Residual
              # Pending runs are accepted rather than chased:
              # activeDeadlineSeconds clears them and the schedule retries.
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
