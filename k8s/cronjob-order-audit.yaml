apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-picqer-order-audit
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: order-audit
spec:
  schedule: "30 2 * * *"
  timeZone: Europe/Madrid
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: order-audit
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
            topology: lan
          containers:
            - name: order-audit
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:28a84315ad79ac2be0ea339a6a79052d68f117669aa7017b4fbea07ed1b718fb
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - node
                - dist/scripts/audit-shopify-picqer-orders.js
              env:
                - name: ORDER_AUDIT_LOOKBACK_DAYS
                  value: "14"
                - name: ORDER_AUDIT_MIN_AGE_MINUTES
                  value: "15"
                - name: SHOPIFY_ORDER_AUDIT_API_VERSION
                  value: "2026-07"
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              # I/O-bound API sync: it spends its time waiting on Picqer and
              # Shopify, so 25m is a sufficient floor. There is no CPU limit
              # here, so this lowers the guaranteed floor only, never the burst.
              # `ubuntu` is the only amd64 + topology=lan node and ~9 of its 16
              # CPU are legitimately reserved by bursty inference services, so
              # even a small floor is enough to leave a run Pending. Residual
              # Pending runs are accepted rather than chased:
              # activeDeadlineSeconds clears them and the schedule retries.
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
