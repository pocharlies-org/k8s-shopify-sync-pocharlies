apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopify-sync-secrets
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: shopify-sync-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: skirmshop-shopify-sync
