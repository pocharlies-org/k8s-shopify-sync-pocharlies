apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopify-sync-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: shopify-sync-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/skirmshop/shopify-sync
