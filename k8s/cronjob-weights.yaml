apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-sync-weights
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: cron
spec:
  # Offset from the warehouse-location sync ("17 */4 * * *") to avoid running
  # both at the same minute. Weight sync is stateless (reads Picqer + Shopify
  # live each run) so it needs no PVC.
  schedule: "41 */6 * * *"
  timeZone: Europe/Madrid
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
            topology: lan
          containers:
            - name: weight-sync
              # CI-signed image (cosign keyless + Trivy-gated) built by
              # release.yml from tag k8s-20260723-cifix4 (main 9029b14) — the
              # release pipeline was fixed 2026-07-23 (startup + base-image npm
              # CVEs). Contains dist/scripts/sync-weights.js. Replaces the earlier
              # hand-built stopgap digest.
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:565e920b8acfd9031dee9e64e46b8f1326e183059f38e1755225774f5becb78b
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - sh
                - -ec
                - |
                  node dist/scripts/sync-weights.js
              env:
                # LIVE. The sync was validated end-to-end on 2026-07-23 (a live
                # run wrote 759 Picqer->Shopify weight diffs, 0 errors, spot-
                # checked on the storefront) using this exact compiled artifact,
                # so it ships enabled. Picqer is the source of truth; anti-garbage
                # + no-downgrade guards keep it safe. Set to "1" to pause to
                # plan-only.
                - name: DRY_RUN
                  value: "0"
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
