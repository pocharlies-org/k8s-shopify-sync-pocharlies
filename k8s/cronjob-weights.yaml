apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-sync-weights
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: cron
spec:
  # Offset from the warehouse-location sync ("17 */4 * * *") to avoid running
  # both at the same minute. Weight sync is stateless (reads Picqer + Shopify
  # live each run) so it needs no PVC.
  schedule: "41 */6 * * *"
  timeZone: Europe/Madrid
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
            topology: lan
          containers:
            - name: weight-sync
              # NOTE: same digest as the warehouse sync. This digest MUST be
              # rebuilt/re-pushed from a shopify-sync-app image that contains
              # Image contains dist/scripts/sync-weights.js (built from
              # shopify-sync-app main ec50cc9, tag k8s-20260723-weightsync).
              # NOTE: hand-built (linux/amd64, --provenance=false) because the
              # tag-triggered release.yml startup-failed on 2026-07-23; repin to
              # a CI-signed digest once that pipeline is fixed.
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:6aa832973404a3ef35708bbb2f1b578eddf93d7150622c6b1a60c6af7746ed26
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - sh
                - -ec
                - |
                  node dist/scripts/sync-weights.js
              env:
                # LIVE. The sync was validated end-to-end on 2026-07-23 (a live
                # run wrote 759 Picqer->Shopify weight diffs, 0 errors, spot-
                # checked on the storefront) using this exact compiled artifact,
                # so it ships enabled. Picqer is the source of truth; anti-garbage
                # + no-downgrade guards keep it safe. Set to "1" to pause to
                # plan-only.
                - name: DRY_RUN
                  value: "0"
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
