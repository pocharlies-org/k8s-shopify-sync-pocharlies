apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopify-sync-weight-receiver
  labels:
    app.kubernetes.io/name: shopify-sync-weight-receiver
    app.kubernetes.io/component: weight-receiver
spec:
  # SKIRM-500: the weight moves by event. This receiver answers Shopify's
  # products/create + products/update webhooks and the v1 weight API; it
  # replaces the shopify-sync-weights CronJob, which was deleted with it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopify-sync-weight-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopify-sync-weight-receiver
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: receiver
          image: harbor.lan.e-dani.com/homelab/shopify-sync-app@sha256:6fbb8a10aa865f94a230b2ebd4808f1c848534d764a1050262bcb52ca8a9c159
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/scripts/weight-server.js
          ports:
            - name: http
              containerPort: 8080
          # PICQER_* + SHOPIFY_STORE/ACCESS_TOKEN + SHOPIFY_WEBHOOK_SECRET +
          # WEIGHT_API_TOKEN. Without the last two the server refuses to start:
          # no unsigned webhooks, no open API.
          envFrom:
            - secretRef:
                name: shopify-sync-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopify-sync-weight-receiver
  labels:
    app.kubernetes.io/name: shopify-sync-weight-receiver
spec:
  selector:
    app.kubernetes.io/name: shopify-sync-weight-receiver
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shopify-sync-weight-receiver
  labels:
    app.kubernetes.io/name: shopify-sync-weight-receiver
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-edge
  routes:
    # One prefix owns both surfaces: Shopify posts the webhooks to
    # /shopify-sync/webhooks/products and the v1 API sits under the same
    # prefix. The API authenticates with a bearer token, not by network.
    - kind: Rule
      match: (Host(`sauvage.e-dani.com`) || Host(`server.skirmshop.es`)) && PathPrefix(`/shopify-sync`)
      services:
        - name: shopify-sync-weight-receiver
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-edge
