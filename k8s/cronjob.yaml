apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-sync-warehouse
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: cron
spec:
  schedule: "17 */4 * * *"
  timeZone: Europe/Madrid
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
            topology: lan
          containers:
            - name: warehouse-sync
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:430c8bc2e60e6cbdfad1cd9ab8dd6cc5f984055bd4a774e11406fc84d5804dc2
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - sh
                - -ec
                - |
                  mkdir -p /state
                  if [ ! -s /state/.warehouse-sync-state.json ]; then
                    echo "State file missing: /state/.warehouse-sync-state.json" >&2
                    exit 1
                  fi
                  node dist/scripts/sync-warehouse-locations.js sync
              env:
                - name: WAREHOUSE_SYNC_STATE_FILE
                  value: /state/.warehouse-sync-state.json
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              volumeMounts:
                - name: state
                  mountPath: /state
              # I/O-bound API sync: it spends its time waiting on Picqer and
              # Shopify, so 25m is a sufficient floor. There is no CPU limit
              # here, so this lowers the guaranteed floor only, never the burst.
              # `ubuntu` is the only amd64 + topology=lan node and ~9 of its 16
              # CPU are legitimately reserved by bursty inference services, so a
              # 100m floor is enough to leave a run Pending. Residual Pending runs
              # are accepted rather than chased: activeDeadlineSeconds clears them
              # and the schedule retries.
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: shopify-sync-state
