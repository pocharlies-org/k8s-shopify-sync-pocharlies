apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-sync-warehouse
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: cron
spec:
  schedule: "17 */4 * * *"
  timeZone: Europe/Madrid
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          nodeSelector:
            kubernetes.io/arch: amd64
            topology: lan
          containers:
            - name: warehouse-sync
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:74ba905635d5fd6d5c502d58b0c6f65e4e71baa9f6d9d4a2d641881d0ab128cc
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - sh
                - -ec
                - |
                  mkdir -p /state
                  if [ ! -s /state/.warehouse-sync-state.json ]; then
                    echo "State file missing: /state/.warehouse-sync-state.json" >&2
                    exit 1
                  fi
                  node dist/scripts/sync-warehouse-locations.js sync
              env:
                - name: WAREHOUSE_SYNC_STATE_FILE
                  value: /state/.warehouse-sync-state.json
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              volumeMounts:
                - name: state
                  mountPath: /state
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: shopify-sync-state
