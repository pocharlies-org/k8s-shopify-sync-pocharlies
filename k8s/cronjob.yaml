# RED DECLARADA (C-1, SC-5888 / SC-5806 «Events, never polling»): desde el 17-11 el
# camino principal va por evento — move del picker → clave `picqer.skirmshop.product.moved`
# → workflow synapse `skirmshop.k8s.shopify-sync-warehouse` → Job desde este CronJob con
# SOLO_SKU=<productcode> (mismo join, misma baseline, misma escritura atómica). Este
# manifiesto es la plantilla del Job y su horario pasa de cada 4 h a DIARIO porque cubre
# lo que el evento no puede: el sentido Shopify→Picqer (el metafield custom.warehouse_location
# es de VARIANTE y `products/update` no dispara por metafields — sin webhook fiable) y los
# eventos perdidos. No se borra.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-sync-warehouse
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: cron
spec:
  schedule: "17 5 * * *" # diario (antes 17 */4 * * *): ver el bloque de arriba — red declarada
  timeZone: Europe/Madrid
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          # atlantic (INFRA-1103): fuera del x86. Solo llama a Picqer y Shopify, y su disco
          # Longhorn (shopify-sync-state) se monta allí; sauvage no tiene Longhorn.
          nodeSelector:
            kubernetes.io/arch: amd64
            node-pool: ovh-heavy
          containers:
            - name: warehouse-sync
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:33868c700e0cb07f4015a47ed50bfa6bd327ebeadba0b32d9f7766b9f9f59d2e
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - sh
                - -ec
                - |
                  mkdir -p /state
                  if [ ! -s /state/.warehouse-sync-state.json ]; then
                    echo "State file missing: /state/.warehouse-sync-state.json" >&2
                    exit 1
                  fi
                  node dist/scripts/sync-warehouse-locations.js sync
              env:
                - name: WAREHOUSE_SYNC_STATE_FILE
                  value: /state/.warehouse-sync-state.json
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              volumeMounts:
                - name: state
                  mountPath: /state
              # I/O-bound API sync: it spends its time waiting on Picqer and
              # Shopify, so 25m is a sufficient floor. There is no CPU limit
              # here, so this lowers the guaranteed floor only, never the burst.
              # Residual Pending runs are accepted rather than chased:
              # activeDeadlineSeconds clears them and the schedule retries.
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: shopify-sync-state
