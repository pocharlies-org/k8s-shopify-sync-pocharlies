# PLANTILLA DEL JOB (C-2, SC-6603 fila #65 de SC-5806 «Events, never polling»): desde el
# 25-11-2026 este CronJob NO se programa — `suspend: true` + `0 0 31 2 *` (31 de febrero:
# nunca). Daniel decidió migrar los CronJobs de casa a eventos **sin red**: no queda
# barrido diario que recupere lo que un evento pierda. El manifiesto sigue aquí porque
# `synapse-adapter-k8s` (`k8s.job_from_cronjob`) construye el Job a partir de este
# `jobTemplate` — borrarlo dejaría los eventos sin plantilla — y porque el `flock` de
# /state del comando es lo que pone en fila el barrido manual y los Jobs de evento.
#
# Qué lo dispara (todo por evento):
#   - `picqer.skirmshop.product.moved`   (move en el picker)                      → SOLO_SKU
#   - `picqer.skirmshop.product.changed` (edición de la ficha: código de proveedor) → SOLO_SKU
#   - `eventos.shopify-sync.product_changed` (Shopify→Picqer: el receptor de pesos publica
#     una pista por SKU en `POST /eventos` cuando Shopify entrega products/create|update)
# Los dos primeros los lanza el workflow synapse `skirmshop.k8s.shopify-sync-warehouse`;
# el tercero, `skirmshop.k8s.shopify-sync-warehouse-shopify`.
#
# Qué se pierde al quitar la red (aceptado en C-2, 25-11-2026): un evento perdido no lo
# recupera nadie hasta que ese SKU vuelva a tocarse, hasta el reloj único de la ola 2 de
# SC-5806, o hasta que alguien lance el barrido a mano
# (`node dist/scripts/sync-warehouse-locations.js sync` sin `SOLO_SKU`).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shopify-sync-warehouse
  labels:
    app.kubernetes.io/name: shopify-sync
    app.kubernetes.io/component: cron
spec:
  schedule: "0 0 31 2 *" # nunca (31 de febrero): ver el bloque de arriba — solo plantilla del Job
  timeZone: Europe/Madrid
  suspend: true # C-2: la red diaria fuera; el Job lo lanza synapse
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shopify-sync
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-pull
          # atlantic (INFRA-1103): fuera del x86. Solo llama a Picqer y Shopify, y su disco
          # Longhorn (shopify-sync-state) se monta allí; sauvage no tiene Longhorn.
          nodeSelector:
            kubernetes.io/arch: amd64
            node-pool: ovh-heavy
          containers:
            - name: warehouse-sync
              image: harbor.e-dani.com/homelab/shopify-sync-app@sha256:ac4a6b7d6561f283775ac651f7e3364ed9cc78ae4fcb83418c4ac4bbe943eb0b
              imagePullPolicy: IfNotPresent
              workingDir: /app
              command:
                - sh
                - -ec
                - |
                  mkdir -p /state
                  if [ ! -s /state/.warehouse-sync-state.json ]; then
                    echo "State file missing: /state/.warehouse-sync-state.json" >&2
                    exit 1
                  fi
                  # SC-5888 (H1 de security en synapse#398): el barrido diario y los Jobs de evento
                  # (SOLO_SKU, creados por synapse-adapter-k8s desde esta plantilla, sin el Forbid
                  # del CronJob) se ponen en fila aquí: cada uno carga y guarda el estado entero.
                  exec flock /state/.warehouse-sync.lock node dist/scripts/sync-warehouse-locations.js sync
              env:
                - name: WAREHOUSE_SYNC_STATE_FILE
                  value: /state/.warehouse-sync-state.json
              envFrom:
                - secretRef:
                    name: shopify-sync-secrets
              volumeMounts:
                - name: state
                  mountPath: /state
              # I/O-bound API sync: it spends its time waiting on Picqer and
              # Shopify, so 25m is a sufficient floor. There is no CPU limit
              # here, so this lowers the guaranteed floor only, never the burst.
              # Residual Pending runs are accepted rather than chased:
              # activeDeadlineSeconds clears them and the schedule retries.
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: shopify-sync-state
